name: Savish Source Sync
on:
  push:
    paths:
      - '.github/workflows/savish-source-sync.yml'
      - 'app/src/main/kotlin/com/music/echo/MainActivity.kt'

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[savish-source-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Restore real MainActivity and integrate Savish UI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/vishallsinghh21/Savish-Music/d70305dad76407bcd3738fad8c9dd03c7cae4ae4/app/src/main/kotlin/com/music/echo/MainActivity.kt -o app/src/main/kotlin/com/music/echo/MainActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/kotlin/com/music/echo/MainActivity.kt')
          s = p.read_text()

          def add_import(line, after):
              global s
              if line not in s and after in s:
                  s = s.replace(after, after + '\n' + line, 1)

          add_import('import echo.music.iad1tya.constants.SavishPlatformKey', 'import echo.music.iad1tya.constants.UseFloatingNavBarKey')
          add_import('import echo.music.iad1tya.constants.SavishGlassHomeKey', 'import echo.music.iad1tya.constants.SavishPlatformKey')
          add_import('import echo.music.iad1tya.constants.SavishGlassSearchKey', 'import echo.music.iad1tya.constants.SavishGlassHomeKey')
          add_import('import echo.music.iad1tya.constants.SavishGlassSettingsKey', 'import echo.music.iad1tya.constants.SavishGlassSearchKey')
          add_import('import echo.music.iad1tya.constants.SavishGlassContentKey', 'import echo.music.iad1tya.constants.SavishGlassSettingsKey')

          s = s.replace('globalEnabled = liquidGlassGlobalEnabled && useFloatingNavBar,', 'globalEnabled = liquidGlassGlobalEnabled,', 1)
          marker = '                val (liquidGlassNavBarEnabled) = rememberPreference(LiquidGlassNavBarEnabledKey, defaultValue = true)'
          if marker in s and 'val (savishPlatform)' not in s:
              s = s.replace(marker, marker + '''\n                val (savishPlatform) = rememberPreference(SavishPlatformKey, defaultValue = "all_media")\n                val (savishHomeGlass) = rememberPreference(SavishGlassHomeKey, defaultValue = true)\n                val (savishSearchGlass) = rememberPreference(SavishGlassSearchKey, defaultValue = true)\n                val (savishSettingsGlass) = rememberPreference(SavishGlassSettingsKey, defaultValue = true)\n                val (savishContentGlass) = rememberPreference(SavishGlassContentKey, defaultValue = true)''', 1)

          s = re.sub(r'(navBarEnabled\s*=\s*liquidGlassNavBarEnabled,)(\s*\))', r'''\1
                        homeEnabled = savishHomeGlass,
                        searchEnabled = savishSearchGlass,
                        settingsEnabled = savishSettingsGlass,
                        contentEnabled = savishContentGlass,\2''', s, count=1)

          s = re.sub(r'(val baseBg = if \(pureBlack\) Color\.Black else MaterialTheme\.colorScheme\.surfaceContainer)', r'''\1
                val savishPlatformBackground = when (savishPlatform) {
                    "youtube" -> Color(0xFF16060B)
                    "spotify" -> Color(0xFF04130C)
                    "jiosaavn" -> Color(0xFF1A0903)
                    else -> Color(0xFF06131A)
                }
                val savishPlatformGlow = when (savishPlatform) {
                    "youtube" -> Color(0xFFFF2D55)
                    "spotify" -> Color(0xFF1DB954)
                    "jiosaavn" -> Color(0xFFFF9500)
                    else -> Color(0xFF18D7F5)
                }''', s, count=1)

          s = re.sub(r'val appBackdrop = rememberLayerBackdrop \{.*?\n                \}', '''val appBackdrop = rememberLayerBackdrop {
                    drawRect(if (liquidGlassGlobalEnabled) savishPlatformBackground else baseBg)
                    if (liquidGlassGlobalEnabled) {
                        drawCircle(
                            color = savishPlatformGlow.copy(alpha = 0.16f),
                            radius = size.minDimension * 0.72f,
                            center = androidx.compose.ui.geometry.Offset(size.width * 0.78f, size.height * 0.18f),
                        )
                    }
                    drawContent()
                }''', s, count=1, flags=re.S)

          s = s.replace('Screens.Home.route -> "Echo Music"', 'Screens.Home.route -> "Savish Music"', 1)
          old = '''                val inSearchScreen by remember {
                    derivedStateOf { currentRoute?.startsWith("search/") == true }
                }'''
          if old in s and 'val isHomeScreen by remember' not in s:
              s = s.replace(old, old + '''
                val isHomeScreen by remember {
                    derivedStateOf { currentRoute == Screens.Home.route }
                }''', 1)

          s = s.replace('''                    shouldShowTopBar = currentRoute in topLevelScreens &&
                        currentRoute != "settings" &&''', '''                    shouldShowTopBar = currentRoute in topLevelScreens &&
                        currentRoute != Screens.Home.route &&
                        currentRoute != "settings" &&''', 1)

          s = s.replace('''                    playerBottomSheetState.isDismissed,
                    showRail,
                ) {''', '''                    playerBottomSheetState.isDismissed,
                    showRail,
                    isHomeScreen,
                ) {''', 1)

          s = s.replace('''                    if (!playerBottomSheetState.isDismissed) bottom += MiniPlayerHeight
                    windowsInsets
                        .only(WindowInsetsSides.Horizontal + WindowInsetsSides.Top)
                        .add(WindowInsets(top = AppBarHeight, bottom = bottom))''', '''                    if (!playerBottomSheetState.isDismissed) bottom += MiniPlayerHeight
                    val topPadding = if (isHomeScreen) 0.dp else AppBarHeight
                    windowsInsets
                        .only(WindowInsetsSides.Horizontal + WindowInsetsSides.Top)
                        .add(WindowInsets(top = topPadding, bottom = bottom))''', 1)

          s = s.replace('''                        !inSearchScreen &&
                            (playerBottomSheetState.isCollapsed || playerBottomSheetState.isDismissed)''', '''                        !inSearchScreen && !isHomeScreen &&
                            (playerBottomSheetState.isCollapsed || playerBottomSheetState.isDismissed)''', 1)
          p.write_text(s)

          hp = Path('app/src/main/kotlin/com/music/echo/ui/screens/HomeScreen.kt')
          h = hp.read_text()
          h = h.replace('import com.music.innertube.YouTube.SearchFilter.Companion.FILTER_SONG', 'import com.music.innertube.YouTube\nimport com.music.innertube.YouTube.SearchFilter.Companion.FILTER_SONG')
          h = h.replace('import echo.music.iad1tya.LocalGlassEffectConfig', 'import echo.music.iad1tya.ui.component.LocalGlassEffectConfig')
          h = h.replace('import echo.music.innertube.models.toMediaMetadata', 'import echo.music.iad1tya.models.toMediaMetadata')
          h = h.replace('defaultValue = false)', 'defaultValue = true)', 1)
          hp.write_text(h)

          gp = Path('app/src/main/kotlin/com/music/echo/ui/screens/settings/GlassEffectSettings.kt')
          g = gp.read_text()
          g = g.replace('title = { Text(stringResource(R.string.liquid_glass_global_enabled)) },', 'title = { Text("Savish Music Theme") },', 1)
          g = g.replace('checked = globalEnabled && useFloatingNavBar,', 'checked = globalEnabled,', 1)
          g = g.replace('onCheckedChange = onGlobalEnabledChange,\n                            enabled = useFloatingNavBar,', 'onCheckedChange = onGlobalEnabledChange,\n                            enabled = true,', 1)
          g = g.replace('id = if (globalEnabled && useFloatingNavBar)', 'id = if (globalEnabled)', 1)
          g = g.replace('onClick = { if (useFloatingNavBar) onGlobalEnabledChange(!globalEnabled) }', 'onClick = { onGlobalEnabledChange(!globalEnabled) }', 1)
          g = g.replace('''description = {
                        Text(
                            stringResource(
                                // Glass is part of the floating nav bar experience and only
                                // takes effect while that bar is enabled.
                                if (useFloatingNavBar) {
                                    R.string.liquid_glass_performance_warning
                                } else {
                                    R.string.liquid_glass_requires_floating_nav_bar
                                }
                            )
                        )
                    },''', 'description = { Text("Global platform background + Liquid Glass rows, cards and boxes. Floating navigation is independent.") },', 1)
          gp.write_text(g)
          PY
          test "$(head -c 20 app/src/main/kotlin/com/music/echo/MainActivity.kt)" != "PLACEHOLDER" || exit 1
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/com/music/echo/MainActivity.kt app/src/main/kotlin/com/music/echo/ui/screens/HomeScreen.kt app/src/main/kotlin/com/music/echo/ui/screens/settings/GlassEffectSettings.kt
          git diff --cached --quiet && exit 0
          git commit -m "Sync real Savish source [savish-source-sync]"
          git push origin HEAD:main

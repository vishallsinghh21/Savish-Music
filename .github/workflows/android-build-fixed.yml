name: Savish Music Fixed Build
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Fix compile errors and Savish UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/kotlin/com/music/echo/MainActivity.kt')
          s=p.read_text()
          if 'import echo.music.iad1tya.constants.SavishPlatformKey' not in s:
              s=s.replace('import echo.music.iad1tya.constants.UseFloatingNavBarKey','import echo.music.iad1tya.constants.UseFloatingNavBarKey\nimport echo.music.iad1tya.constants.SavishPlatformKey',1)
          marker='                val (liquidGlassNavBarEnabled) = rememberPreference(LiquidGlassNavBarEnabledKey, defaultValue = true)'
          if marker in s and 'val (savishPlatform)' not in s:
              s=s.replace(marker,marker+'\n                val (savishPlatform) = rememberPreference(SavishPlatformKey, defaultValue = "all_media")',1)
          s=s.replace('globalEnabled = liquidGlassGlobalEnabled && useFloatingNavBar,','globalEnabled = liquidGlassGlobalEnabled,',1)
          s=s.replace('shouldShowTopBar = currentRoute in topLevelScreens &&\n                        currentRoute != "settings" &&','shouldShowTopBar = currentRoute in topLevelScreens &&\n                        currentRoute != Screens.Home.route &&\n                        currentRoute != "settings" &&',1)
          a=s.find('                val baseBg = if (pureBlack) Color.Black else MaterialTheme.colorScheme.surfaceContainer')
          b=s.find('                val ringtoneViewModel: RingtoneViewModel = viewModel()',a)
          if a>=0 and b>a:
              block='''                val baseBg = if (pureBlack) Color.Black else MaterialTheme.colorScheme.surfaceContainer\n                val savishThemeColor = when (savishPlatform) {\n                    "youtube" -> Color(0xFF3D0A1A)\n                    "spotify" -> Color(0xFF075B39)\n                    "jiosaavn" -> Color(0xFF7A2D08)\n                    else -> Color(0xFF073C58)\n                }\n                val appBackdrop = rememberLayerBackdrop { drawContent() }\n\n'''
              s=s[:a]+block+s[b:]
          s=s.replace('Scaffold(\n                        snackbarHost = { SnackbarHost(snackbarHostState) },','Scaffold(\n                        containerColor = if (liquidGlassGlobalEnabled) savishThemeColor else baseBg,\n                        snackbarHost = { SnackbarHost(snackbarHostState) },',1)
          p.write_text(s)

          hp=Path('app/src/main/kotlin/com/music/echo/ui/screens/HomeScreen.kt')
          h=hp.read_text()
          h=h.replace('import com.music.innertube.YouTube.SearchFilter.Companion.FILTER_SONG','import com.music.innertube.YouTube\nimport com.music.innertube.YouTube.SearchFilter.Companion.FILTER_SONG')
          h=h.replace('import echo.music.iad1tya.LocalGlassEffectConfig','import echo.music.iad1tya.ui.component.LocalGlassEffectConfig')
          h=h.replace('import echo.music.innertube.models.toMediaMetadata','import echo.music.iad1tya.models.toMediaMetadata')
          old='''Brush.verticalGradient(\n                        listOf(Color(0xFF080C12), Color(0xFF101923), Color(0xFF07151A))\n                    )'''
          new='''Brush.verticalGradient(\n                        when (selectedPlatform.name) {\n                            "youtube" -> listOf(Color(0xFF16060B), Color(0xFF5B0A20), Color(0xFF07121B))\n                            "spotify" -> listOf(Color(0xFF04130C), Color(0xFF075B39), Color(0xFF03131A))\n                            "jiosaavn" -> listOf(Color(0xFF1A0903), Color(0xFF8B3108), Color(0xFF25061B))\n                            else -> listOf(Color(0xFF06131A), Color(0xFF073C58), Color(0xFF080B18))\n                        }\n                    )'''
          h=h.replace(old,new,1)
          hp.write_text(h)

          gp=Path('app/src/main/kotlin/com/music/echo/ui/screens/settings/GlassEffectSettings.kt')
          g=gp.read_text()
          g=g.replace('R.drawable.home','R.drawable.music_note').replace('R.drawable.search','R.drawable.music_note').replace('R.drawable.settings','R.drawable.music_note').replace('R.drawable.tune','R.drawable.music_note')
          gp.write_text(g)
          print('Savish UI fixes applied')
          PY
      - name: Build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks; else keytool -genkeypair -keystore keystore.jks -storepass android -alias savishrelease -keypass android -dname "CN=Savish Music,O=Savish Music,C=IN" -keyalg RSA -keysize 2048 -validity 10000; KEY_ALIAS=savishrelease; KEY_PASSWORD=android; STORE_PASSWORD=android; fi
          chmod +x gradlew
          ./gradlew assembleUniversalFossRelease
      - name: Sign and verify
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then KEY_ALIAS=savishrelease; KEY_PASSWORD=android; STORE_PASSWORD=android; fi
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          find app/build/outputs/apk -name '*.apk' -print0 | while IFS= read -r -d '' apk; do "$APKSIGNER" sign --ks keystore.jks --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true "$apk"; "$APKSIGNER" verify --verbose "$apk"; done
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Savish-Music-Final-Release-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Savish Music APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Prepare Release Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          echo "Using configured release keystore"
        else
          keytool -genkeypair \
            -keystore keystore.jks \
            -storepass android \
            -alias savishrelease \
            -keypass android \
            -dname "CN=Savish Music,O=Savish Music,C=IN" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
          echo "Generated temporary release keystore"
        fi

    - name: Build Release APK
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          export KEY_ALIAS="${KEY_ALIAS}"
          export KEY_PASSWORD="${KEY_PASSWORD}"
          export STORE_PASSWORD="${STORE_PASSWORD}"
        else
          export KEY_ALIAS="savishrelease"
          export KEY_PASSWORD="android"
          export STORE_PASSWORD="android"
        fi
        chmod +x gradlew
        ./gradlew assembleUniversalFossRelease

    - name: Upload Savish Music Release APK
      uses: actions/upload-artifact@v4
      with:
        name: Savish-Music-Release-APK
        path: app/build/outputs/apk/**/*.apk

name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Savish Music APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Apply Savish Music Theme integration
      run: |
        python3 - <<'PY'
        from pathlib import Path

        # Home is the custom Savish surface: hide the old app bar and keep the
        # global backdrop visible through the Home content when Savish Theme is on.
        p = Path("app/src/main/kotlin/com/music/echo/MainActivity.kt")
        s = p.read_text()
        old = '''                val inSearchScreen by remember {\n                    derivedStateOf { currentRoute?.startsWith("search/") == true }\n                }'''
        new = '''                val inSearchScreen by remember {\n                    derivedStateOf { currentRoute?.startsWith("search/") == true }\n                }\n                val isHomeScreen by remember {\n                    derivedStateOf { currentRoute == Screens.Home.route }\n                }'''
        if old in s:
            s = s.replace(old, new, 1)
        old = '''                val playerAwareWindowInsets = remember(\n                    bottomInset,\n                    shouldShowNavigationBar,\n                    playerBottomSheetState.isDismissed,\n                    showRail,\n                ) {'''
        new = '''                val playerAwareWindowInsets = remember(\n                    bottomInset,\n                    shouldShowNavigationBar,\n                    playerBottomSheetState.isDismissed,\n                    showRail,\n                    isHomeScreen,\n                ) {'''
        if old in s:
            s = s.replace(old, new, 1)
        old = '''                    if (!playerBottomSheetState.isDismissed) bottom += MiniPlayerHeight\n                    windowsInsets\n                        .only(WindowInsetsSides.Horizontal + WindowInsetsSides.Top)\n                        .add(WindowInsets(top = AppBarHeight, bottom = bottom))'''
        new = '''                    if (!playerBottomSheetState.isDismissed) bottom += MiniPlayerHeight\n                    val topPadding = if (isHomeScreen) 0.dp else AppBarHeight\n                    windowsInsets\n                        .only(WindowInsetsSides.Horizontal + WindowInsetsSides.Top)\n                        .add(WindowInsets(top = topPadding, bottom = bottom))'''
        if old in s:
            s = s.replace(old, new, 1)
        old = '''                val topAppBarScrollBehavior = appBarScrollBehavior(\n                    canScroll = {\n                        !inSearchScreen &&\n                            (playerBottomSheetState.isCollapsed || playerBottomSheetState.isDismissed)\n                    },\n                )'''
        new = '''                val topAppBarScrollBehavior = appBarScrollBehavior(\n                    canScroll = {\n                        !inSearchScreen && !isHomeScreen &&\n                            (playerBottomSheetState.isCollapsed || playerBottomSheetState.isDismissed)\n                    },\n                )'''
        if old in s:
            s = s.replace(old, new, 1)
        old = '''                    shouldShowTopBar = currentRoute in topLevelScreens &&\n                        currentRoute != "settings" &&'''
        new = '''                    shouldShowTopBar = currentRoute in topLevelScreens &&\n                        currentRoute != Screens.Home.route &&\n                        currentRoute != "settings" &&'''
        if old in s:
            s = s.replace(old, new, 1)

        # Feed Savish Theme state into the existing Liquid Glass configuration.
        marker = '''                val (liquidGlassNavBarEnabled) = rememberPreference(LiquidGlassNavBarEnabledKey, defaultValue = true)'''
        addition = '''                val (liquidGlassNavBarEnabled) = rememberPreference(LiquidGlassNavBarEnabledKey, defaultValue = true)\n                val (savishGlassHomeEnabled) = rememberPreference(SavishGlassHomeKey, defaultValue = false)\n                val (savishGlassSearchEnabled) = rememberPreference(SavishGlassSearchKey, defaultValue = false)\n                val (savishGlassSettingsEnabled) = rememberPreference(SavishGlassSettingsKey, defaultValue = false)\n                val (savishGlassContentEnabled) = rememberPreference(SavishGlassContentKey, defaultValue = false)\n                val (savishPlatform) = rememberPreference(SavishPlatformKey, defaultValue = "all_media")'''
        if marker in s and "savishGlassHomeEnabled" not in s:
            s = s.replace(marker, addition, 1)

        s = s.replace('globalEnabled = liquidGlassGlobalEnabled && useFloatingNavBar,', 'globalEnabled = liquidGlassGlobalEnabled,', 1)
        marker = '''                        navBarEnabled = liquidGlassNavBarEnabled,\n                    )'''
        addition = '''                        navBarEnabled = liquidGlassNavBarEnabled,\n                        homeEnabled = savishGlassHomeEnabled,\n                        searchEnabled = savishGlassSearchEnabled,\n                        settingsEnabled = savishGlassSettingsEnabled,\n                        contentEnabled = savishGlassContentEnabled,\n                    )'''
        if marker in s and 'homeEnabled = savishGlassHomeEnabled' not in s:
            s = s.replace(marker, addition, 1)

        old = '''                val baseBg = if (pureBlack) Color.Black else MaterialTheme.colorScheme.surfaceContainer\n                val appBackdrop = rememberLayerBackdrop {\n                    drawRect(baseBg)\n                    drawContent()\n                }'''
        new = '''                val baseBg = if (pureBlack) Color.Black else MaterialTheme.colorScheme.surfaceContainer\n                val savishThemeColors = when (savishPlatform) {\n                    "youtube" -> listOf(Color(0xFF16060B), Color(0xFF5B0A20), Color(0xFF07121B))\n                    "spotify" -> listOf(Color(0xFF04130C), Color(0xFF075B39), Color(0xFF03131A))\n                    "jiosaavn" -> listOf(Color(0xFF1A0903), Color(0xFF8B3108), Color(0xFF25061B))\n                    else -> listOf(Color(0xFF06131A), Color(0xFF073C58), Color(0xFF080B18))\n                }\n                val appBackdrop = rememberLayerBackdrop(savishPlatform, liquidGlassGlobalEnabled) {\n                    drawRect(baseBg)\n                    if (liquidGlassGlobalEnabled) {\n                        drawRect(Brush.verticalGradient(savishThemeColors))\n                        drawCircle(\n                            brush = Brush.radialGradient(\n                                colors = listOf(savishThemeColors[1].copy(alpha = 0.62f), Color.Transparent),\n                                center = Offset(size.width * 0.5f, size.height * 0.28f),\n                                radius = size.maxDimension * 0.72f,\n                            ),\n                            radius = size.maxDimension * 0.72f,\n                            center = Offset(size.width * 0.5f, size.height * 0.28f),\n                        )\n                    }\n                    drawContent()\n                }'''
        if old in s:
            s = s.replace(old, new, 1)
        p.write_text(s)

        # Keep Home's theme backdrop global instead of painting an opaque local gradient.
        hp = Path("app/src/main/kotlin/com/music/echo/ui/screens/HomeScreen.kt")
        hs = hp.read_text()
        if 'import echo.music.iad1tya.constants.LiquidGlassGlobalEnabledKey' not in hs:
            hs = hs.replace('import echo.music.iad1tya.constants.SavishGlassHomeKey\n', 'import echo.music.iad1tya.constants.LiquidGlassGlobalEnabledKey\nimport echo.music.iad1tya.constants.SavishGlassHomeKey\n')
        if 'val savishThemeEnabled by rememberPreference(LiquidGlassGlobalEnabledKey' not in hs:
            hs = hs.replace('    val (savedPlatform, setSavedPlatform) = rememberPreference(', '    val savishThemeEnabled by rememberPreference(LiquidGlassGlobalEnabledKey, defaultValue = false)\n    val (savedPlatform, setSavedPlatform) = rememberPreference(', 1)
        hs = hs.replace('''                .background(\n                    Brush.verticalGradient(\n                        listOf(Color(0xFF080C12), Color(0xFF101923), Color(0xFF07151A))\n                    )\n                )''', '''                .background(\n                    if (savishThemeEnabled) Color.Transparent\n                    else Color(0xFF080C12)\n                )''', 1)
        # Correct the shared media metadata extension package in the source patch.
        hs = hs.replace('import echo.music.innertube.models.toMediaMetadata', 'import echo.music.iad1tya.models.toMediaMetadata')
        hp.write_text(hs)

        # Rename the existing Liquid Glass screen and repurpose its master switch as
        # the Savish Music Theme switch. No duplicate blur/transparency controls are added.
        gp = Path("app/src/main/kotlin/com/music/echo/ui/screens/settings/GlassEffectSettings.kt")
        gs = gp.read_text()
        gs = gs.replace('title = stringResource(R.string.liquid_glass)', 'title = "Savish Music Theme"', 1)
        gs = gs.replace('title = { Text(stringResource(R.string.liquid_glass_global_enabled)) }', 'title = { Text("Savish Music Theme") }', 1)
        old = '''description = {\n                        Text(\n                            stringResource(\n                                // Glass is part of the floating nav bar experience and only\n                                // takes effect while that bar is enabled.\n                                if (useFloatingNavBar) {\n                                    R.string.liquid_glass_performance_warning\n                                } else {\n                                    R.string.liquid_glass_requires_floating_nav_bar\n                                }\n                            )\n                        )\n                    },'''
        new = '''description = {\n                        Text(if (globalEnabled) "Savish Theme effects are active" else "Enable Savish Music Theme to activate platform backgrounds and glass UI")\n                    },'''
        if old in gs:
            gs = gs.replace(old, new, 1)
        gs = gs.replace('checked = globalEnabled && useFloatingNavBar,', 'checked = globalEnabled,', 1)
        gs = gs.replace('onCheckedChange = onGlobalEnabledChange,\n                            enabled = useFloatingNavBar,', 'onCheckedChange = onGlobalEnabledChange,\n                            enabled = true,', 1)
        gs = gs.replace('id = if (globalEnabled && useFloatingNavBar) R.drawable.check else R.drawable.close', 'id = if (globalEnabled) R.drawable.check else R.drawable.close', 1)
        gs = gs.replace('onClick = { if (useFloatingNavBar) onGlobalEnabledChange(!globalEnabled) }', 'onClick = { onGlobalEnabledChange(!globalEnabled) }', 1)
        marker = '''    val (navBarEnabled, onNavBarEnabledChange) = rememberPreference(\n        LiquidGlassNavBarEnabledKey, defaultValue = true\n    )'''
        addition = '''    val (navBarEnabled, onNavBarEnabledChange) = rememberPreference(\n        LiquidGlassNavBarEnabledKey, defaultValue = true\n    )\n    val (homeEnabled, onHomeEnabledChange) = rememberPreference(SavishGlassHomeKey, defaultValue = false)\n    val (searchEnabled, onSearchEnabledChange) = rememberPreference(SavishGlassSearchKey, defaultValue = false)\n    val (settingsEnabled, onSettingsEnabledChange) = rememberPreference(SavishGlassSettingsKey, defaultValue = false)\n    val (contentEnabled, onContentEnabledChange) = rememberPreference(SavishGlassContentKey, defaultValue = false)'''
        if marker in gs and 'val (homeEnabled, onHomeEnabledChange)' not in gs:
            gs = gs.replace(marker, addition, 1)
        marker = '''            items = listOf(\n                Material3SettingsItem(\n                    icon = painterResource(R.drawable.music_note),\n                    title = { Text(stringResource(R.string.liquid_glass_player)) },'''
        insert = '''            items = listOf(\n                Material3SettingsItem(\n                    icon = painterResource(R.drawable.home),\n                    title = { Text("Glass Home UI") },\n                    description = { Text("Glass rows, cards and search bar inside Home") },\n                    trailingContent = {\n                        Switch(checked = homeEnabled, onCheckedChange = onHomeEnabledChange)\n                    },\n                    onClick = { onHomeEnabledChange(!homeEnabled) }\n                ),\n                Material3SettingsItem(\n                    icon = painterResource(R.drawable.search),\n                    title = { Text("Glass Search UI") },\n                    description = { Text("Glass rows, cards and search controls inside Search") },\n                    trailingContent = {\n                        Switch(checked = searchEnabled, onCheckedChange = onSearchEnabledChange)\n                    },\n                    onClick = { onSearchEnabledChange(!searchEnabled) }\n                ),\n                Material3SettingsItem(\n                    icon = painterResource(R.drawable.settings),\n                    title = { Text("Glass Settings UI") },\n                    description = { Text("Glass rows and boxes inside Settings") },\n                    trailingContent = {\n                        Switch(checked = settingsEnabled, onCheckedChange = onSettingsEnabledChange)\n                    },\n                    onClick = { onSettingsEnabledChange(!settingsEnabled) }\n                ),\n                Material3SettingsItem(\n                    icon = painterResource(R.drawable.tune),\n                    title = { Text("Glass Rows / Cards") },\n                    description = { Text("Glass rows and cards on other app screens") },\n                    trailingContent = {\n                        Switch(checked = contentEnabled, onCheckedChange = onContentEnabledChange)\n                    },\n                    onClick = { onContentEnabledChange(!contentEnabled) }\n                ),\n                Material3SettingsItem(\n                    icon = painterResource(R.drawable.music_note),\n                    title = { Text(stringResource(R.string.liquid_glass_player)) },'''
        if marker in gs and 'Glass Home UI' not in gs:
            gs = gs.replace(marker, insert, 1)
        gs = gs.replace('title = { Text(stringResource(R.string.liquid_glass_settings)) }', 'title = { Text("Savish Music Theme") }', 1)
        gp.write_text(gs)
        print("Savish Music Theme integration patch applied")
        PY

    - name: Prepare Release Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          echo "Using configured release keystore"
        else
          keytool -genkeypair \
            -keystore keystore.jks \
            -storepass android \
            -alias savishrelease \
            -keypass android \
            -dname "CN=Savish Music,O=Savish Music,C=IN" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
          echo "Generated temporary release keystore"
        fi

    - name: Build Release APK
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          export KEY_ALIAS="${KEY_ALIAS}"
          export KEY_PASSWORD="${KEY_PASSWORD}"
          export STORE_PASSWORD="${STORE_PASSWORD}"
        else
          export KEY_ALIAS="savishrelease"
          export KEY_PASSWORD="android"
          export STORE_PASSWORD="android"
        fi
        chmod +x gradlew
        ./gradlew assembleUniversalFossRelease

    - name: Sign Release APK for Direct Install
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          KEY_ALIAS="savishrelease"
          KEY_PASSWORD="android"
          STORE_PASSWORD="android"
        fi
        APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)
        test -n "$APKSIGNER"
        find app/build/outputs/apk -type f -name '*.apk' -print0 | while IFS= read -r -d '' apk; do
          "$APKSIGNER" sign \
            --ks keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            "$apk"
          "$APKSIGNER" verify --verbose "$apk"
        done

    - name: Upload Savish Music Release APK
      uses: actions/upload-artifact@v4
      with:
        name: Savish-Music-Release-APK
        path: app/build/outputs/apk/**/*.apk

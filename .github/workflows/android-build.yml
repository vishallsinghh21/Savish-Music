name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Savish Music APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Fix Savish Home Header
      run: |
        python3 - <<'PY'
        from pathlib import Path
        p = Path("app/src/main/kotlin/com/music/echo/MainActivity.kt")
        s = p.read_text()
        old = '''                val inSearchScreen by remember {\n                    derivedStateOf { currentRoute?.startsWith("search/") == true }\n                }'''
        new = '''                val inSearchScreen by remember {\n                    derivedStateOf { currentRoute?.startsWith("search/") == true }\n                }\n                val isHomeScreen by remember {\n                    derivedStateOf { currentRoute == Screens.Home.route }\n                }'''
        if old not in s: raise SystemExit("Home route marker not found")
        s = s.replace(old, new, 1)
        old = '''                val playerAwareWindowInsets = remember(\n                    bottomInset,\n                    shouldShowNavigationBar,\n                    playerBottomSheetState.isDismissed,\n                    showRail,\n                ) {'''
        new = '''                val playerAwareWindowInsets = remember(\n                    bottomInset,\n                    shouldShowNavigationBar,\n                    playerBottomSheetState.isDismissed,\n                    showRail,\n                    isHomeScreen,\n                ) {'''
        if old not in s: raise SystemExit("Insets marker not found")
        s = s.replace(old, new, 1)
        old = '''                    if (!playerBottomSheetState.isDismissed) bottom += MiniPlayerHeight\n                    windowsInsets\n                        .only(WindowInsetsSides.Horizontal + WindowInsetsSides.Top)\n                        .add(WindowInsets(top = AppBarHeight, bottom = bottom))'''
        new = '''                    if (!playerBottomSheetState.isDismissed) bottom += MiniPlayerHeight\n                    val topPadding = if (isHomeScreen) 0.dp else AppBarHeight\n                    windowsInsets\n                        .only(WindowInsetsSides.Horizontal + WindowInsetsSides.Top)\n                        .add(WindowInsets(top = topPadding, bottom = bottom))'''
        if old not in s: raise SystemExit("Top padding marker not found")
        s = s.replace(old, new, 1)
        old = '''                val topAppBarScrollBehavior = appBarScrollBehavior(\n                    canScroll = {\n                        !inSearchScreen &&\n                            (playerBottomSheetState.isCollapsed || playerBottomSheetState.isDismissed)\n                    },\n                )'''
        new = '''                val topAppBarScrollBehavior = appBarScrollBehavior(\n                    canScroll = {\n                        !inSearchScreen && !isHomeScreen &&\n                            (playerBottomSheetState.isCollapsed || playerBottomSheetState.isDismissed)\n                    },\n                )'''
        if old not in s: raise SystemExit("Scroll marker not found")
        s = s.replace(old, new, 1)
        old = '''                    shouldShowTopBar = currentRoute in topLevelScreens &&\n                        currentRoute != "settings" &&'''
        new = '''                    shouldShowTopBar = currentRoute in topLevelScreens &&\n                        currentRoute != Screens.Home.route &&\n                        currentRoute != "settings" &&'''
        if old not in s: raise SystemExit("Top bar marker not found")
        s = s.replace(old, new, 1)
        p.write_text(s)
        print("Savish Home header fix applied")
        PY

    - name: Fix Savish Home Content and Search
      run: |
        python3 - <<'PY'
        from pathlib import Path
        p = Path("app/src/main/kotlin/com/music/echo/ui/screens/HomeScreen.kt")
        s = p.read_text()
        if 'import androidx.compose.foundation.text.KeyboardActions' not in s:
            s = s.replace('import androidx.compose.foundation.text.BasicTextField\n', 'import androidx.compose.foundation.text.BasicTextField\nimport androidx.compose.foundation.text.KeyboardActions\nimport androidx.compose.foundation.text.KeyboardOptions\n')
        if 'import androidx.compose.ui.text.input.ImeAction' not in s:
            s = s.replace('import androidx.compose.ui.text.TextStyle\n', 'import androidx.compose.ui.text.TextStyle\nimport androidx.compose.ui.text.input.ImeAction\n')
        if 'import java.net.URLEncoder' not in s:
            s += '\nimport java.net.URLEncoder\n'
        s = s.replace('homePage!!.sections.take(8)', 'homePage!!.sections')
        old = '''                                value = searchText,\n                                onValueChange = { searchText = it },\n                                singleLine = true,'''
        new = '''                                value = searchText,\n                                onValueChange = { searchText = it },\n                                singleLine = true,\n                                keyboardOptions = KeyboardOptions(imeAction = ImeAction.Search),\n                                keyboardActions = KeyboardActions(onSearch = {\n                                    val query = searchText.trim()\n                                    if (query.isNotEmpty()) {\n                                        navController.navigate("search/${URLEncoder.encode(query, "UTF-8")}")\n                                    }\n                                }),'''
        if old not in s: raise SystemExit("Search field marker not found")
        s = s.replace(old, new, 1)
        old = '''        LazyRow(\n            contentPadding = androidx.compose.foundation.layout.PaddingValues(horizontal = 18.dp),\n            horizontalArrangement = Arrangement.spacedBy(16.dp)\n        ) {'''
        new = '''        LazyRow(\n            userScrollEnabled = true,\n            contentPadding = androidx.compose.foundation.layout.PaddingValues(horizontal = 18.dp),\n            horizontalArrangement = Arrangement.spacedBy(16.dp)\n        ) {'''
        if old not in s: raise SystemExit("Album row marker not found")
        s = s.replace(old, new, 1)
        p.write_text(s)
        print("Savish Home content/search fix applied")
        PY

    - name: Prepare Release Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          echo "Using configured release keystore"
        else
          keytool -genkeypair \
            -keystore keystore.jks \
            -storepass android \
            -alias savishrelease \
            -keypass android \
            -dname "CN=Savish Music,O=Savish Music,C=IN" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
          echo "Generated temporary release keystore"
        fi

    - name: Build Release APK
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          export KEY_ALIAS="${KEY_ALIAS}"
          export KEY_PASSWORD="${KEY_PASSWORD}"
          export STORE_PASSWORD="${STORE_PASSWORD}"
        else
          export KEY_ALIAS="savishrelease"
          export KEY_PASSWORD="android"
          export STORE_PASSWORD="android"
        fi
        chmod +x gradlew
        ./gradlew assembleUniversalFossRelease

    - name: Upload Savish Music Release APK
      uses: actions/upload-artifact@v4
      with:
        name: Savish-Music-Release-APK
        path: app/build/outputs/apk/**/*.apk
